apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clear the shared source workspace before cloning the repository.
  workspaces:
    - name: source
  steps:
    - name: remove-existing-source
      image: registry.access.redhat.com/ubi9/ubi-minimal
      script: |
        #!/usr/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  description: Install project requirements and lint the Python application and tests.
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -r requirements.txt
        flake8 service tests

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run the service unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: unit-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -r requirements.txt
        nosetests -v
